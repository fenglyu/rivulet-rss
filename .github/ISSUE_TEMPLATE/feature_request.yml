name: Feature request
description: Propose a concrete user-facing improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives
      description: Describe workarounds or alternatives considered.
